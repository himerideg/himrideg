name: GASSNI V16.3 Expo Validate

on:
  push:
    branches:
      - gassni-apk-build-20260927
    paths:
      - "_gassni_build/source.tar.xz.b64"
      - ".github/workflows/gassni-apk-build.yml"

permissions:
  contents: read

jobs:
  expo-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct V16.3 Expo source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/gassni-v163
          base64 -d _gassni_build/source.tar.xz.b64 > /tmp/gassni-v163.tar.xz
          tar -xJf /tmp/gassni-v163.tar.xz -C /tmp/gassni-v163
          test -f /tmp/gassni-v163/package.json
          test -f /tmp/gassni-v163/src/screens/NewBookingScreen.js

      - name: Install dependencies
        working-directory: /tmp/gassni-v163
        run: npm ci --no-audit --no-fund

      - name: Expo config check
        working-directory: /tmp/gassni-v163
        run: npx expo config --type public >/tmp/expo-config.json

      - name: Metro export compile check
        working-directory: /tmp/gassni-v163
        env:
          CI: "1"
        run: npx expo export --platform android --output-dir /tmp/gassni-expo-export
