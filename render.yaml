services:
  - type: web
    name: himrideg-api
    runtime: node
    plan: starter
    rootDir: server
    # Phase 2 package-lock fully synchronized hai; deterministic production install ke liye npm ci use hota hai.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v2/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://himrideg.com,https://www.himrideg.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: ADMIN_RESET_ON_START
        value: "false"
      - key: UPLOAD_ROOT
        value: /var/data/himrideg-uploads
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        value: 691367484066-udd03uov2vsf8el8v8o3d6n3503b2rja.apps.googleusercontent.com
      - key: REAL_MONEY_MODE
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_PAYOUTS_ENABLED
        value: "true"
      - key: RAZORPAYX_KEY_ID
        sync: false
      - key: RAZORPAYX_KEY_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      - key: RAZORPAYX_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_API_BASE
        value: https://api.razorpay.com/v1
      - key: PAYOUT_SCHEDULER_INTERVAL_MS
        value: "300000"
      - key: FAST2SMS_API_KEY
        sync: false
      - key: SMS_ENABLED
        value: "false"
      - key: GEOAPIFY_API_KEY
        sync: false

      # Phase 2 scalability — Redis remains opt-in until a Redis service URL is configured.
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_REQUIRED
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: himrideg:v2
      - key: SOCKET_REDIS_ADAPTER_ENABLED
        value: "true"
      - key: LIVE_LOCATION_CACHE_ENABLED
        value: "true"
      - key: LIVE_LOCATION_CACHE_TTL_SECONDS
        value: "90"
      - key: LIVE_LOCATION_ACCESS_TTL_SECONDS
        value: "8"
      - key: LIVE_LOCATION_MONGO_PERSIST_MS
        value: "15000"
      - key: BACKGROUND_JOBS_ENABLED
        value: "true"
      - key: BACKGROUND_JOB_QUEUE
        value: jobs:default
      # Phase 3 distributed matching + atomic accept protection
      - key: DISTRIBUTED_DRIVER_AVAILABILITY_ENABLED
        value: "true"
      - key: DRIVER_MATCH_REDIS_PREFILTER_ENABLED
        value: "true"
      - key: DRIVER_AVAILABILITY_TTL_SECONDS
        value: "120"
      - key: DRIVER_LOCATION_STALE_SECONDS
        value: "180"
      - key: DRIVER_AVAILABILITY_WARMUP_LIMIT
        value: "5000"
      - key: RIDE_ACCEPT_DISTRIBUTED_LOCK_ENABLED
        value: "true"
      - key: RIDE_ACCEPT_LOCK_TTL_MS
        value: "8000"

      # Phase 4 performance + reliability
      - key: MAP_CACHE_REDIS_ENABLED
        value: "true"
      - key: MAP_CACHE_NAMESPACE
        value: map
      - key: WEBHOOK_DURABLE_ACK_ENABLED
        value: "true"
      - key: WEBHOOK_BACKGROUND_QUEUE_ENABLED
        value: "true"
      - key: WEBHOOK_RETRY_MAX_ATTEMPTS
        value: "5"
      - key: UPLOAD_STORAGE_MODE
        value: hybrid-gridfs
    disk:
      name: himrideg-uploads
      mountPath: /var/data/himrideg-uploads
      sizeGB: 1
